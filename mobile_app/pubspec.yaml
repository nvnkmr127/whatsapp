name: whatsapp_pro_mobile
description: "High-performance WhatsApp-style Flutter app for agents."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0

  # Networking & Real-time
  dio: ^5.4.1
  connectivity_plus: ^6.0.3
  pusher_client_fixed: ^0.0.5
  # Using laravel_echo from pub to bridge the Laravel sync
  laravel_echo: ^1.0.0-beta.1

  # Local DB & Persistence
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  flutter_secure_storage: ^10.0.0

  # Push Notifications
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^21.0.0

  # UI & Animations
  font_awesome_flutter: ^11.0.0
  google_fonts: ^8.0.2
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  flutter_spinkit: ^5.2.1
  timeago: ^3.6.1
  image_picker: ^1.0.7
  shimmer: ^3.0.0
  mobile_scanner: ^7.0.0
  share_plus: ^11.1.0
  file_picker: ^11.0.2
  mime: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  mockito: ^5.4.4
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
