; =============================================================================
; WhatsApp Business API - Supervisor Queue Worker Configuration
; =============================================================================
; Installation Instructions:
; 1. Copy this file to: /etc/supervisor/conf.d/whatsapp-workers.conf
; 2. Update the paths below to match your deployment directory
; 3. Run: sudo supervisorctl reread
; 4. Run: sudo supervisorctl update
; 5. Run: sudo supervisorctl start whatsapp-queue:*
; =============================================================================

; IMPORTANT: Update these paths for your DigitalOcean server
; Replace /var/www/whatsapp with your actual project path
; Replace www-data with your actual web server user

[program:whatsapp-queue-webhooks]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/whatsapp/artisan queue:work redis --queue=webhooks --sleep=3 --tries=3 --timeout=300 --max-jobs=1000
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=5
redirect_stderr=true
stdout_logfile=/var/www/whatsapp/storage/logs/worker-webhooks.log
stdout_logfile_maxbytes=50MB
stopwaitsecs=3600
startsecs=0

